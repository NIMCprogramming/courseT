[project]
name = "your-course"
version = "0.1.0"
description = "A hands-on terminal course."
requires-python = ">=3.11"
dependencies = [
    "courset-engine @ git+https://github.com/NIMCprogramming/courseT.git",
]

[project.scripts]
your-course = "course_app.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/course_app"]

[tool.hatch.build.targets.wheel.force-include]
"lessons" = "course_app/lessons"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
strict = true
files = ["src"]
